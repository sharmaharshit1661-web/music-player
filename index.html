<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>म्यूजिक प्लेयर — Music Player</title>
    <meta name="description" content="म्यूजिक प्लेयर — Premium 3D Coverflow Music Player">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Outfit:wght@300;400;500;600;700;800;900&family=Space+Grotesk:wght@500;600;700&family=Syne:wght@700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-analytics-compat.js"></script>
</head>
<body>

    <!-- Ambient Background -->
    <div class="bg-layer">
        <video class="bg-video" id="bgVideo" autoplay loop muted playsinline>
            <source src="video.mp4" type="video/mp4">
        </video>
        <div class="bg-overlay"></div>
    </div>

    <!-- Floating Background-less Clock & Calendar Widget -->
    <div class="clock-widget" id="clockWidget">
        <div class="clock-float-time">
            <span class="float-hours" id="clockHours">00</span>
            <span class="float-colon" id="clockColon">:</span>
            <span class="float-minutes" id="clockMinutes">00</span>
            <span class="float-ampm" id="clockAmPm">AM</span>
        </div>
        <div class="clock-float-date">
            <span class="float-day" id="clockDay">THURSDAY</span>
            <span class="float-slash">/</span>
            <span class="float-date-num" id="clockDateNum">13</span>
            <span class="float-month" id="clockMonth">AUGUST</span>
            <span class="float-year" id="clockYear">2026</span>
        </div>
    </div>

    <!-- Active Users Badge — Upper Center -->
    <div class="active-users-badge" id="activeUsersBadge">
        <span class="active-pulse-dot"></span>
        <svg class="active-users-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="15" height="15">
            <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
            <circle cx="9" cy="7" r="4"/>
            <path d="M23 21v-2a4 4 0 0 0-3-3.87"/>
            <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
        </svg>
        <span class="active-users-count" id="activeUsersCount">1</span>
        <span class="active-users-label">LISTENING NOW</span>
    </div>

    <!-- Full Screen Toggle Button — Upper Right -->
    <button class="fullscreen-btn" id="fullscreenBtn" aria-label="Toggle Fullscreen" aria-pressed="false">
        <svg class="icon-expand" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="16" height="16">
            <path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7"/>
        </svg>
        <svg class="icon-compress" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="16" height="16" style="display:none">
            <path d="M4 14h6v6M20 10h-6V4M14 10l7-7M10 14l-7 7"/>
        </svg>
    </button>

    <!-- Main Content -->
    <div class="app">

        <!-- 3D Coverflow Carousel -->
        <section class="carousel-section" id="carouselSection">
            <div class="carousel" id="carousel">
                <!-- Cards injected by JS -->
            </div>
        </section>

        <!-- Floating Glassmorphism Control Bar -->
        <div class="control-bar" id="controlBar">
            <!-- Left Controls -->
            <div class="control-bar__left">
                <button class="ctrl-btn" id="prevBtn" aria-label="Previous">
                    <svg viewBox="0 0 24 24" fill="currentColor" width="20" height="20"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
                </button>
                <button class="ctrl-btn ctrl-btn--play" id="playBtn" aria-label="Play/Pause">
                    <svg class="icon-play" viewBox="0 0 24 24" fill="currentColor" width="22" height="22"><path d="M8 5v14l11-7z"/></svg>
                    <svg class="icon-pause" viewBox="0 0 24 24" fill="currentColor" width="22" height="22"><path d="M6 5h4v14H6zm8 0h4v14h-4z"/></svg>
                </button>
                <button class="ctrl-btn" id="nextBtn" aria-label="Next">
                    <svg viewBox="0 0 24 24" fill="currentColor" width="20" height="20"><path d="M16 6h2v12h-2zm-2 6L5.5 6v12z"/></svg>
                </button>
            </div>

            <!-- Center Mini Player Capsule (Clean Dark Section) -->
            <div class="mini-player" id="miniPlayer">
                <img class="mini-player__art" id="miniArt" src="assets/album2.png" alt="Now Playing">
                <div class="mini-player__info">
                    <div class="mini-player__meta">
                        <span class="mini-player__artist" id="miniArtist">Kumar Sanu</span>
                        <span class="mini-player__time" id="miniTime">0:00 / 6:02</span>
                    </div>
                    <span class="mini-player__title" id="miniTitle">Saaton Janam Main Tere</span>
                    <div class="mini-player__progress" id="miniProgressBar" role="slider" tabindex="0" aria-label="Seek">
                        <div class="mini-player__progress-fill" id="miniProgress"></div>
                    </div>
                </div>
            </div>

            <!-- Right Controls (Volume & Spotify Embed Toggle) -->
            <div class="control-bar__right">
                <button class="ctrl-btn ctrl-btn--sm" id="spotifyEmbedBtn" aria-label="Open Spotify Player">
                    <svg viewBox="0 0 24 24" fill="currentColor" width="18" height="18"><path d="M12 0C5.4 0 0 5.4 0 12s5.4 12 12 12 12-5.4 12-12S18.6 0 12 0zm5.5 17.3c-.2.3-.6.4-.9.2-2.8-1.7-6.3-2.1-10.5-1.1-.3.1-.7-.1-.8-.4-.1-.3.1-.7.4-.8 4.6-1.1 8.5-.6 11.6 1.3.3.1.4.6.2.8zm1.5-3.3c-.3.4-.8.5-1.2.3-3.2-2-8.1-2.6-11.9-1.4-.4.1-.9-.1-1-.5-.1-.4.1-.9.5-1 4.3-1.3 9.7-.6 13.3 1.6.4.2.5.7.3 1zm.1-3.4c-.3.5-1 .7-1.5.4-3.8-2.3-10.1-2.5-13.7-1.4-.6.2-1.2-.2-1.4-.7-.2-.6.2-1.2.7-1.4 4.2-1.3 11.2-1 15.5 1.6.5.3.7 1 .4 1.5z"/></svg>
                </button>
                <button class="ctrl-btn ctrl-btn--sm" id="volumeBtn" aria-label="Mute/Unmute Volume">
                    <svg class="icon-vol-high" viewBox="0 0 24 24" fill="currentColor" width="18" height="18"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.8-1-3.3-2.5-4v8c1.5-.7 2.5-2.2 2.5-4zM14 3.2v2.1c2.9.9 5 3.5 5 6.7s-2.1 5.8-5 6.7v2.1c4-.9 7-4.5 7-8.8s-3-7.9-7-8.8z"/></svg>
                    <svg class="icon-vol-mute" viewBox="0 0 24 24" fill="currentColor" width="18" height="18"><path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/></svg>
                </button>
            </div>
        </div>
    </div>

    <!-- Spotify Official Embed Player Panel -->
    <div class="spotify-embed-modal" id="spotifyEmbedModal">
        <div class="spotify-embed-card">
            <div class="spotify-embed-header">
                <div class="spotify-embed-title">
                    <svg viewBox="0 0 24 24" fill="#1DB954" width="18" height="18"><path d="M12 0C5.4 0 0 5.4 0 12s5.4 12 12 12 12-5.4 12-12S18.6 0 12 0zm5.5 17.3c-.2.3-.6.4-.9.2-2.8-1.7-6.3-2.1-10.5-1.1-.3.1-.7-.1-.8-.4-.1-.3.1-.7.4-.8 4.6-1.1 8.5-.6 11.6 1.3.3.1.4.6.2.8zm1.5-3.3c-.3.4-.8.5-1.2.3-3.2-2-8.1-2.6-11.9-1.4-.4.1-.9-.1-1-.5-.1-.4.1-.9.5-1 4.3-1.3 9.7-.6 13.3 1.6.4.2.5.7.3 1zm.1-3.4c-.3.5-1 .7-1.5.4-3.8-2.3-10.1-2.5-13.7-1.4-.6.2-1.2-.2-1.4-.7-.2-.6.2-1.2.7-1.4 4.2-1.3 11.2-1 15.5 1.6.5.3.7 1 .4 1.5z"/></svg>
                    <span>Spotify Recommendation Playlist</span>
                </div>
                <button class="spotify-embed-close" id="closeSpotifyEmbed" aria-label="Close">✕</button>
            </div>
            <iframe
                title="Spotify Embed: Recommendation Playlist"
                src="https://open.spotify.com/embed/playlist/6nu65eBGKeC6LPMpOfQ0Gw?utm_source=generator&theme=0"
                width="100%"
                height="360"
                frameborder="0"
                allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"
                loading="lazy">
            </iframe>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
